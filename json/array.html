<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="stylesheet" href="css_json.css">
</head>
<body>
  <div class="container">
    <h1>Cadastro de Filmes</h1>
    
    <!-- Formulário -->
    <form id="form-cadastro">
      <div class="form-group">
        <label for="titulo">Título do Filme</label>
        <input type="text" id="titulo" required placeholder="Ex: O Poderoso Chefão">
      </div>
      <div class="form-group">
        <label for="diretor">Diretor</label>
        <input type="text" id="diretor" required placeholder="Ex: Francis Ford Coppola">
      </div>
      <div class="form-group">
        <label for="ano">Ano de Lançamento</label>
        <input type="number" id="ano" required placeholder="Ex: 1972">
      </div>
      <button type="submit" class="btn btn-primary">Salvar Filme</button>
    </form>

    <!-- Área de Listagem -->
    <div class="header-actions">
      <h2>Meus Filmes</h2>
      <button id="btn-limpar" class="btn btn-danger">Limpar Registros</button>
    </div>

    <ul id="lista">
      <!-- Os registros aparecerão aqui via JavaScript -->
    </ul>
  </div>
</body>
<script src="json.js"></script>
</html>
