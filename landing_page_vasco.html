<!-- Define que este é um documento HTML5 -->
<!DOCTYPE html>
<!-- Inicia a tag html definindo o idioma como Português do Brasil -->
<html lang="pt-BR">
<!-- Cabeçalho do documento contendo metadados e links -->
<head>
    <!-- Define a codificação de caracteres (permite o uso de acentos e cedilha) -->
    <meta charset="UTF-8">
    <!-- Torna a página responsiva para telas de celulares e tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da página que aparece na aba do navegador -->
    <title>Vasco da Gama - Teste de Fidelidade</title>
    
    <!-- 
      ATENÇÃO ESTUDANTE (ENTREGA SIGAA/GITHUB):
      O requisito 3.2 do PDF exige CSS externo. 
      Crie um arquivo chamado 'estilo.css' na mesma pasta.
      Recorte tudo que está ENTRE as tags <style> e </style> e cole lá.
      Depois, troque toda esta tag <style> por: <link rel="stylesheet" href="estilo.css">
    -->
    <style>
        /* Selecionador de raiz (pseudo-classe) para criar variáveis de cor padrão do Vasco */
        :root {
            /* Cor preta principal */
            --vasco-black: #050505;
            /* Cor branca principal */
            --vasco-white: #ffffff;
            /* Vermelho da Cruz de Malta */
            --vasco-red: #C8102E;
            /* Cinza escuro para gradientes de fundo */
            --vasco-dark-gray: #1f1f1f;
        }

        /* Seletor global (*): Aplica a todos os elementos da página */
        * {
            /* Remove as margens padrão do navegador */
            margin: 0;
            /* Remove os preenchimentos padrão do navegador */
            padding: 0;
            /* Garante que bordas e preenchimentos não aumentem o tamanho total do elemento */
            box-sizing: border-box;
            /* Define a fonte principal da página */
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Seletor de tag: Estiliza o corpo do documento HTML */
        body {
            /* Define a cor de fundo usando a variável preta */
            background-color: var(--vasco-black);
            /* Define a cor do texto usando a variável branca */
            color: var(--vasco-white);
            /* Esconde as barras de rolagem (útil para os confetes não vazarem) */
            overflow: hidden; 
            /* Usa Flexbox para alinhar o conteúdo */
            display: flex;
            /* Centraliza o conteúdo horizontalmente no flexbox */
            justify-content: center;
            /* Centraliza o conteúdo verticalmente no flexbox */
            align-items: center;
            /* Define a altura mínima como 100% da altura da tela (viewport) */
            min-height: 100vh;
        }

        /* Seletor de tag: Estiliza os títulos principais */
        h1 {
            /* Define o tamanho da fonte */
            font-size: 2.5rem;
            /* Adiciona espaço abaixo do título */
            margin-bottom: 10px;
            /* Força o texto a ficar todo em letras maiúsculas */
            text-transform: uppercase;
            /* Aumenta o espaçamento entre as letras */
            letter-spacing: 2px;
            /* Centraliza o texto */
            text-align: center;
        }

        /* Seletor de tags: Estiliza campos de digitação e botões simultaneamente */
        input, button {
            /* Adiciona espaço interno (respiro) nos elementos */
            padding: 15px;
            /* Aumenta o tamanho da fonte */
            font-size: 1.2rem;
            /* Arredonda os cantos dos elementos */
            border-radius: 8px;
            /* Remove a borda azul de foco padrão de alguns navegadores */
            outline: none;
            /* Adiciona uma transição suave para mudanças de estado (ex: hover) */
            transition: all 0.3s ease;
        }

        /* Seletor de classe: Define o layout base de cada 'tela' do jogo */
        .screen {
            /* Usa Flexbox para organizar os elementos da tela */
            display: flex;
            /* Organiza os elementos em coluna (um embaixo do outro) */
            flex-direction: column;
            /* Centraliza os itens verticalmente */
            justify-content: center;
            /* Centraliza os itens horizontalmente */
            align-items: center;
            /* Ocupa 100% da largura disponível */
            width: 100%;
            /* Ocupa 100% da altura disponível da tela */
            height: 100vh;
            /* Adiciona preenchimento nas bordas */
            padding: 20px;
            /* Centraliza os textos dentro da tela */
            text-align: center;
            /* Posiciona a tela no topo esquerdo absoluto, sobrepondo outras telas */
            position: absolute;
            top: 0;
            left: 0;
            /* Efeito suave ao esconder/mostrar telas */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease;
        }

        /* Seletor de classe: Usado via JS para esconder uma tela */
        .hidden {
            /* Deixa a tela totalmente transparente */
            opacity: 0;
            /* Desativa cliques nos elementos desta tela */
            pointer-events: none;
            /* Joga a tela para o fundo, atrás de tudo */
            z-index: -1;
            /* Afasta levemente a tela para dar efeito de zoom-out */
            transform: scale(0.95);
        }

        /* Seletor de classe: Usado via JS para mostrar uma tela */
        .active {
            /* Deixa a tela totalmente visível */
            opacity: 1;
            /* Traz a tela para a frente */
            z-index: 10;
            /* Restaura o tamanho original */
            transform: scale(1);
        }

        /* Seletor de classe: Estiliza o container do formulário */
        .form-group {
            /* Usa Flexbox em coluna */
            display: flex;
            flex-direction: column;
            /* Espaço entre o input e o botão */
            gap: 15px;
            /* Ocupa toda a largura até o limite máximo */
            width: 100%;
            /* Define a largura máxima do formulário */
            max-width: 400px;
            /* Fundo levemente transparente sobre o fundo preto */
            background: rgba(255, 255, 255, 0.05);
            /* Espaço interno do formulário */
            padding: 30px;
            /* Bordas arredondadas maiores */
            border-radius: 12px;
            /* Sombra projetada para dar profundidade */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Borda sutil e transparente */
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Seletor de classe: Estiliza o campo de texto */
        .form-input {
            /* Borda inicial branca */
            border: 2px solid var(--vasco-white);
            /* Fundo transparente para herdar o fundo escuro */
            background-color: transparent;
            /* Texto digitado em branco */
            color: var(--vasco-white);
            /* Centraliza o texto digitado */
            text-align: center;
        }

        /* Pseudo-classe: Estiliza o campo quando está selecionado/clicado */
        .form-input:focus {
            /* Muda a borda para vermelho quando focado */
            border-color: var(--vasco-red);
        }

        /* Seletor de classe: Estiliza os botões */
        .btn {
            /* Deixa o texto em negrito */
            font-weight: bold;
            /* Texto em maiúsculo */
            text-transform: uppercase;
            /* Muda o cursor para uma 'mãozinha' indicando clique */
            cursor: pointer;
            /* Fundo branco padrão */
            background-color: var(--vasco-white);
            /* Texto do botão em preto */
            color: var(--vasco-black);
            /* Remove a borda padrão do HTML */
            border: none;
            /* Evita que o usuário selecione o texto do botão sem querer */
            user-select: none;
        }

        /* Pseudo-classe: Estiliza o botão quando o mouse passa por cima */
        .btn:hover {
            /* Muda o fundo para vermelho */
            background-color: var(--vasco-red);
            /* Muda o texto para branco */
            color: var(--vasco-white);
            /* Dá um leve pulo para cima (efeito de elevação) */
            transform: translateY(-3px);
            /* Adiciona um brilho vermelho embaixo do botão */
            box-shadow: 0 5px 15px rgba(200, 16, 46, 0.4);
        }

        /* Seletor de ID: Fundo da tela principal em gradiente linear */
        #initial-screen {
            /* Vai do preto até o cinza escuro no canto inferior direito */
            background: linear-gradient(135deg, var(--vasco-black) 40%, var(--vasco-dark-gray) 100%);
        }

        /* Seletor de ID: Fundo da tela de erro (completamente preto) */
        #scenario-1 {
            background-color: var(--vasco-black);
        }

        /* Seletor de ID: Fundo da tela de sucesso (gradiente radial partindo do centro) */
        #scenario-2 {
            /* Do cinza escuro no centro para o preto nas bordas */
            background: radial-gradient(circle, var(--vasco-dark-gray) 0%, var(--vasco-black) 100%);
        }

        /* Seletor de classe: Texto gigante da mensagem de erro */
        .giant-text {
            /* Tamanho dinâmico baseado na largura da tela (10% da viewport width) */
            font-size: 10vw;
            /* Fonte bem grossa */
            font-weight: 900;
            /* Cor do texto em vermelho */
            color: var(--vasco-red);
            /* Texto em maiúsculo */
            text-transform: uppercase;
            /* Altura da linha ajustada para o texto não sobrepor linhas */
            line-height: 1;
            /* Margem abaixo do texto */
            margin-bottom: 40px;
            /* Aplica a animação infinita chamada pulseText */
            animation: pulseText 1.5s infinite;
        }

        /* Define os passos da animação de pulso do texto */
        @keyframes pulseText {
            /* No início: tamanho normal */
            0% { transform: scale(1); }
            /* No meio: um pouco maior e com sombra/brilho vermelho */
            50% { transform: scale(1.05); text-shadow: 0 0 20px var(--vasco-red); }
            /* No fim: volta ao tamanho normal */
            100% { transform: scale(1); }
        }

        /* Seletor de classe: Estiliza o ícone da Cruz de Malta (SVG) */
        .cruz-de-malta {
            /* Largura do ícone */
            width: 200px;
            /* Altura do ícone */
            height: 200px;
            /* Espaço abaixo do ícone */
            margin-bottom: 30px;
            /* Aplica a animação de flutuação */
            animation: floatLogo 3s ease-in-out infinite;
            /* Traz para frente dos confetes */
            z-index: 20; 
        }

        /* Define os passos da animação flutuante do logo */
        @keyframes floatLogo {
            /* Começa na posição zero */
            0% { transform: translateY(0); }
            /* Sobe 15 pixels no meio da animação */
            50% { transform: translateY(-15px); }
            /* Retorna à posição original */
            100% { transform: translateY(0); }
        }

        /* Container que engloba o spinner de carregamento e seu texto */
        .spinner-container {
            /* Usa flexbox em coluna */
            display: flex;
            flex-direction: column;
            /* Centraliza os itens */
            align-items: center;
            /* Espaço entre o spinner e o texto */
            gap: 15px;
            /* Espaço abaixo do bloco */
            margin-bottom: 30px;
            /* Fica acima de outros elementos */
            z-index: 20;
        }

        /* O círculo animado do spinner */
        .spinner {
            /* Largura do spinner */
            width: 50px;
            /* Altura do spinner */
            height: 50px;
            /* Borda semi-transparente como base */
            border: 5px solid rgba(255, 255, 255, 0.1);
            /* Uma das bordas (a de cima) recebe a cor vermelha do Vasco */
            border-top: 5px solid var(--vasco-red);
            /* Arredonda as bordas completamente para formar um círculo */
            border-radius: 50%;
            /* Aplica a animação de giro (linear para não acelerar/desacelerar) */
            animation: spin 1s linear infinite;
        }

        /* Define os passos da animação de giro do spinner */
        @keyframes spin {
            /* Inicia do ângulo 0 */
            0% { transform: rotate(0deg); }
            /* Dá uma volta completa (360 graus) */
            100% { transform: rotate(360deg); }
        }

        /* Seletor de ID: O container invisível que segura os confetes */
        #confetti-container {
            /* Posição absoluta travada no topo esquerdo */
            position: absolute;
            top: 0;
            left: 0;
            /* Cobre a tela inteira */
            width: 100%;
            height: 100%;
            /* Impede que os confetes bloqueiem cliques nos botões que estão atrás deles */
            pointer-events: none;
            /* Define a profundidade da camada */
            z-index: 5;
        }

        /* Seletor de classe: O pedaço individual de confete gerado pelo JS */
        .confetti {
            /* Posicionado absolutamente em relação ao container */
            position: absolute;
            /* Largura do confete */
            width: 12px;
            /* Altura do confete (levemente retangular) */
            height: 24px;
            /* Inicia fora da tela (acima) */
            top: -30px;
            /* Aplica a animação de queda, o 'forwards' mantêm no estado final */
            animation: fall linear forwards;
            /* Arredonda de leve os confetes */
            border-radius: 2px;
        }

        /* Define os passos da animação de queda da chuva de confetes */
        @keyframes fall {
            /* Cai 110% da altura da tela girando nos três eixos para dar efeito 3D simulado */
            to { 
                transform: translateY(110vh) rotateX(720deg) rotateY(360deg) rotateZ(360deg); 
            }
        }
    </style>
</head>
<body>
    <!-- 
      Requisito 3.1 do PDF: Estrutura HTML Semântica
      A tag <main> indica o conteúdo principal do documento.
    -->
    <main>
        <!-- Primeira Seção: Tela Inicial com formulário. Ativa por padrão (class 'active') -->
        <section id="initial-screen" class="screen active">
            <!-- Título da página -->
            <h1>Saudações Vascaínas</h1>
            <!-- Subtítulo de contexto -->
            <p style="color: #aaa; margin-bottom: 40px; font-size: 1.2rem;">Faça o teste de fidelidade clubística.</p>
            
            <!-- 
              Requisito 3.4 do PDF: Formulário com evento 'submit'
              A tag <form> permite capturar o "Enter" do teclado, não só o clique no botão.
            -->
            <form id="team-form" class="form-group">
                <!-- Label para acessibilidade -->
                <label for="team-input">Qual é o seu time?</label>
                
                <!-- Requisito 3.1: Campo de entrada de texto -->
                <!-- autocomplete="off" desativa sugestões do navegador que atrapalham a UI -->
                <input type="text" id="team-input" class="form-input" placeholder="Digite aqui..." autocomplete="off">
                
                <!-- Requisito 3.1: Botão de envio do formulário (type="submit") -->
                <button type="submit" class="btn">Confirmar</button>
            </form>
        </section>

        <!-- Segunda Seção: Tela de Rejeição (Escondida por padrão - class 'hidden') -->
        <section id="scenario-1" class="screen hidden">
            <!-- 
              Requisito 3.3 do PDF: Alterar conteúdo dinamicamente.
              Esta tag H2 está vazia no HTML, o JS injetará o texto "TENHO PENA DE VOCÊ" nela.
            -->
            <h2 id="rejection-text" class="giant-text"></h2>
            
            <!-- Botão para voltar à tela inicial -->
            <button type="button" class="btn" id="back-btn-1">Tentar Novamente</button>
        </section>

        <!-- Terceira Seção: Tela de Sucesso Vascaíno (Escondida por padrão) -->
        <section id="scenario-2" class="screen hidden">
            <!-- Gráfico Vetorial (SVG) da Cruz de Malta (Vasco). Não perde qualidade. -->
            <svg class="cruz-de-malta" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Desenha o formato da cruz com a cor vermelha -->
                <path fill="#C8102E" d="M50 15 C60 15, 65 5, 85 5 C85 25, 75 30, 75 40 C85 40, 95 35, 95 50 C95 65, 85 60, 75 60 C75 70, 85 75, 85 95 C65 95, 60 85, 50 85 C40 85, 35 95, 15 95 C15 75, 25 70, 25 60 C15 60, 5 65, 5 50 C5 35, 15 40, 25 40 C25 30, 15 25, 15 5 C35 5, 40 15, 50 15 Z" />
            </svg>

            <!-- Container do Spinner (Requisito extra da sua solicitação) -->
            <!-- Aparece enquanto a música estiver fazendo download -->
            <div class="spinner-container" id="loading-spinner">
                <!-- A bolinha que gira -->
                <div class="spinner"></div>
                <!-- Texto de aviso abaixo da bolinha -->
                <span style="font-size: 0.9rem; color: #aaa;">Carregando o hino...</span>
            </div>

            <!-- Botão para voltar à tela inicial (irá parar a música via JS) -->
            <!-- Adicionei z-index inline para garantir que fique acima dos confetes -->
            <button type="button" class="btn" id="back-btn-2" style="z-index: 20;">Voltar</button>
            
            <!-- Div vazia onde o JavaScript irá injetar milhares de divs "confetes" dinamicamente -->
            <div id="confetti-container"></div>
        </section>
    </main>

    <!-- 
      ATENÇÃO ESTUDANTE (ENTREGA SIGAA/GITHUB):
      O PDF pede JavaScript separado em regras gerais.
      Crie um arquivo 'script.js'.
      Recorte tudo dentro desta tag <script> e cole no arquivo.
      Depois, troque esta tag por: <script src="script.js"></script>
    -->
    <script>
        // REQUISITO 3.3 DO PDF: Seleção de Elementos usando getElementById e querySelector
        
        // Seleciona a seção da Tela Inicial buscando pelo atributo ID
        const initialScreen = document.getElementById('initial-screen');
        // Seleciona a seção do Cenário 1 (Não é Vasco) pelo ID
        const scenario1 = document.getElementById('scenario-1');
        // Seleciona a seção do Cenário 2 (É Vasco) pelo ID
        const scenario2 = document.getElementById('scenario-2');
        
        // Seleciona o formulário principal usando o seletor universal do querySelector (# indica ID)
        const teamForm = document.querySelector('#team-form');
        // Seleciona o campo de digitação de texto usando querySelector
        const teamInput = document.querySelector('#team-input');
        // Seleciona a tag H2 vazia onde a frase de efeito será inserida
        const rejectionText = document.querySelector('#rejection-text');
        
        // Seleciona os dois botões "Voltar" (um em cada tela final) pelo seus IDs
        const backBtn1 = document.getElementById('back-btn-1');
        const backBtn2 = document.getElementById('back-btn-2');
        
        // Seleciona os containers de efeitos visuais (spinner e a div vazia de confetes)
        const loadingSpinner = document.getElementById('loading-spinner');
        const confettiContainer = document.getElementById('confetti-container');

        // Cria uma nova instância nativa do objeto de Áudio do JS com a URL do hino oficial do Vasco
        // Atualizado para usar um arquivo .mp3 de uma fonte confiável para evitar problemas de CORS e suporte de formato
        const anthemAudio = new Audio('https://hinomp3.com/hinos/v/hino-vasco-da-gama.mp3');
        // Removido o crossOrigin = 'anonymous' para permitir a reprodução nativa sem restrições de CORS
        
        // Declaração de variável que guardará o ID do loop temporal dos confetes
        // Precisamos dessa variável no escopo global para conseguir pará-la em outra função depois
        let confettiInterval; 

        // Função utilitária que limpa o texto digitado pelo usuário para evitar erros bobos
        function sanitizeInput(text) {
            // 1. Converte todo o texto para letras minúsculas (ex: "VaScO" vira "vasco")
            let lowerText = text.toLowerCase(); 
            // 2. Remove acentos matematicamente usando a normalização NFD do JS (ex: "Vásco" vira "Vasco")
            let withoutAccents = lowerText.normalize('NFD').replace(/[\u0300-\u036f]/g, ""); 
            // 3. Remove espaços extras que o usuário possa ter digitado no começo ou final da palavra
            return withoutAccents.trim(); 
        }

        // Função principal do sistema, acionada quando o formulário é disparado
        function evaluateTeam(event) {
            // REQUISITO 3.4 DO PDF: Interrompe o envio padrão do HTML, evitando o refresh (recarregamento) da página
            event.preventDefault(); 
            
            // REQUISITO 3.3 DO PDF: Lê o valor exato que está dentro do campo <input> naquele momento
            const inputValue = teamInput.value;
            
            // Verificação simples de segurança: Se o usuário tentar enviar o campo vazio
            if (inputValue === '') {
                // REQUISITO 3.3 DO PDF: Altera o estilo CSS do elemento diretamente via JavaScript
                // Destaca as bordas do campo em vermelho para avisar que algo está errado
                teamInput.style.borderColor = 'var(--vasco-red)'; 
                // Interrompe imediatamente a execução da função (não vai para as próximas linhas)
                return; 
            }

            // Passa o texto original pela função de limpeza que criamos acima
            const cleanedInput = sanitizeInput(inputValue);

            // Agora começamos a transição de telas: Esconde a tela inicial
            // Remove a classe CSS 'active' (que deixa visível)
            initialScreen.classList.remove('active');
            // Adiciona a classe CSS 'hidden' (que joga opacidade pra zero e esconde)
            initialScreen.classList.add('hidden');

            // Testa as possibilidades usando operadores lógicos OR (||)
            // Aceitamos "vasco", "vasco da gama" ou até erros de digitação comuns como "vaxco"
            if (cleanedInput === 'vasco' || cleanedInput === 'vasco da gama' || cleanedInput === 'vaxco') {
                
                // CENÁRIO 2: É VASCO!
                // Mostra a tela do cenário 2
                scenario2.classList.remove('hidden');
                scenario2.classList.add('active');
                
                // REQUISITO 3.3 DO PDF: Alterar estilo. 
                // Mostra a bolinha giratória de loading na tela
                loadingSpinner.style.display = 'flex'; 
                
                // CORREÇÃO CRÍTICA DO ÁUDIO: O play() deve ser acionado IMEDIATAMENTE no clique/submit
                // Não podemos usar .load() e esperar evento, senão o navegador bloqueia achando que é autoplay solto.
                const playPromise = anthemAudio.play();
                
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        // Sucesso! A música carregou o suficiente e começou a tocar.
                        // Esconde o loading e inicia a festa.
                        loadingSpinner.style.display = 'none';
                        startConfetti();
                    }).catch(error => {
                        // Removido o log 'console.error' para manter o console limpo
                        // Fallback: Se der erro no áudio na rede, pelo menos libera os confetes para a tela não travar
                        loadingSpinner.style.display = 'none';
                        startConfetti();
                    });
                }

            } else {
                
                // CENÁRIO 1: É QUALQUER OUTRO TIME!
                // Mostra a tela preta punitiva
                scenario1.classList.remove('hidden');
                scenario1.classList.add('active');
                
                // REQUISITO 3.3 DO PDF: Alterar conteúdo.
                // Injeta a frase no H2 que estava vazio no HTML
                rejectionText.textContent = 'TENHO PENA DE VOCÊ'; 
            }
        }

        // Função responsável por gerar a chuva de papéis picados
        function startConfetti() {
            // Define uma lista com as 3 cores oficiais do Club de Regatas Vasco da Gama
            const colors = ['#C8102E', '#ffffff', '#000000']; 
            
            // Inicia um loop (setInterval) que vai disparar um código a cada 100 milissegundos
            // Atribuímos esse loop à variável global para podermos parar a chuva depois
            confettiInterval = setInterval(() => {
                
                // REQUISITO 3.3: Cria um elemento novo do tipo DIV diretamente na memória do JS
                const confetti = document.createElement('div');
                
                // Adiciona a classe 'confetti' que estilizamos lá no topo, no CSS
                confetti.classList.add('confetti');
                
                // Sorteia uma posição horizontal na tela (entre 0 e 100% da largura - vw)
                confetti.style.left = Math.random() * 100 + 'vw';
                
                // Sorteia qual das 3 cores da array ele vai ter, arredondando o número com Math.floor
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Sorteia o tempo que esse pedaço vai demorar pra cair (entre 2.5 e 5.5 segundos)
                confetti.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
                
                // REQUISITO 3.3 DO PDF: Injeta o elemento recém-criado dentro da div 'confetti-container' no HTML
                confettiContainer.appendChild(confetti);
                
                // Cria um temporizador que espera 5500 milissegundos e depois destrói o confete
                // Fundamental para não encher a memória do computador e travar a página (Memory Leak)
                setTimeout(() => {
                    // Remove do HTML
                    confetti.remove(); 
                }, 5500);

            }, 100); // 100ms = 1 décimo de segundo
        }

        // Função disparada ao clicar no botão 'Voltar' de qualquer um dos cenários
        function resetPage() {
            // 1. Comando de áudio: Pausa a música imediatamente
            anthemAudio.pause();
            // 2. Comando de áudio: Zera o tempo da música, voltando pro segundo 0
            anthemAudio.currentTime = 0;
            
            // 3. Cancela o loop de setInterval, parando de gerar novos confetes no teto
            clearInterval(confettiInterval);
            
            // 4. REQUISITO 3.3 DO PDF: Destrói de uma vez todos os confetes que estão caindo 
            // Limpa o interior (innerHTML) da div container inteira
            confettiContainer.innerHTML = '';
            
            // 5. REQUISITO 3.3 DO PDF: Zera a propriedade .value do input, apagando o que foi digitado
            teamInput.value = '';
            // 6. Restaura a borda do campo de entrada para branco, caso estivesse vermelha por erro
            teamInput.style.borderColor = 'var(--vasco-white)';
            
            // 7. Esconde a Tela do Cenário 1 (se estiver visível)
            scenario1.classList.remove('active');
            scenario1.classList.add('hidden');
            
            // 8. Esconde a Tela do Cenário 2 (se estiver visível)
            scenario2.classList.remove('active');
            scenario2.classList.add('hidden');
            
            // 9. Volta a exibir com estilo a Tela Inicial do formulário
            initialScreen.classList.remove('hidden');
            initialScreen.classList.add('active');
        }

        // REQUISITO 3.4 DO PDF: Registrar dois ou mais eventos com addEventListener.
        // Aqui atendemos à exigência com louvor, usando 'submit', 'input' e 'click'.

        // Evento 1 (submit): Ocorre quando clica em 'Confirmar' ou aperta 'Enter' dentro do input.
        // Ao ocorrer, ele invoca a função 'evaluateTeam' que tem toda a lógica do nosso sistema.
        teamForm.addEventListener('submit', evaluateTeam);

        // Evento 2 (input): Este é o segundo evento solicitado pelo PDF.
        // Ele ocorre em tempo real, a cada letra que o usuário digita (ou apaga) no teclado.
        // Usamos ele para uma finalidade de UX (Experiência do Usuário):
        // Se a borda ficou vermelha (erro), a primeira letra digitada apaga o vermelho e volta pro branco.
        teamInput.addEventListener('input', function() {
            teamInput.style.borderColor = 'var(--vasco-white)'; 
        });

        // Evento 3 (click): Ocorre quando a pessoa clica no botão com o mouse ou dedo.
        // Associa o botão de voltar da tela de rejeição à função de limpeza geral.
        backBtn1.addEventListener('click', resetPage);
        
        // Evento 4 (click): Faz a mesma coisa, mas para o botão da tela do Vasco.
        backBtn2.addEventListener('click', resetPage);

    </script>
</body>
